<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        #capa-publicitaria {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            max-width: 640px;
            padding: 15px;
            text-align: center;
        }
        .video-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        .thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }
        .play-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
        }
        .play-btn::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #fff;
            margin-left: 5px;
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Capa invisible para Adsterra -->
    <div id="capa-publicitaria"></div>

    <div class="video-container">
        <div class="video-box">
            <!-- Imagen oscura de fondo simulando video -->
            <img class="thumbnail" src="https://unsplash.com" alt="Video Thumbnail">
            <div class="play-btn"></div>
        </div>
        <p class="loading-text">Cargando reproductor multimedia seguro...</p>
    </div>

    <script>
        const miAdsterraLink = "https://auctionr.org";
        const capa = document.getElementById('capa-publicitaria');
        
        capa.addEventListener('click', function() {
            window.open(miAdsterraLink, '_blank');
            capa.style.display = 'none';
        });
    </script>
</body>
</html>
