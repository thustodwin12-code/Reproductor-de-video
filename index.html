<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        /* Capa transparente invisible de Adsterra */
        #capa-publicitaria {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            max-width: 640px;
            padding: 15px;
            text-align: center;
        }
        .video-box {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .play-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #fff;
            pointer-events: none; 
            z-index: 10;
        }
        .play-btn::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #fff;
            margin-left: 5px;
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
            animation: pulse 1.5s infinite;
        }
        /* BOTÓN DE TELEGRAM AJUSTADO */
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; /* Azul oficial de Telegram */
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-telegram:active {
            transform: scale(0.98);
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <!-- Esta capa intercepta el primer clic de Adsterra -->
    <div id="capa-publicitaria"></div>

    <div class="video-container">
        <div class="video-box">
            <div class="play-btn" id="icono-play"></div>
            
            <video id="mi-video" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Haz clic en el reproductor para iniciar...</p>
        
        <!-- BOTÓN GRANDE DE TELEGRAM -->
        <!-- REEMPLAZA EL LINK DE ABAJO POR EL ENLACE DE INVITACIÓN DE TU NUEVO CANAL -->
        <a href="https://t.me/+aDr8f3yBBXQzMWY5" class="btn-telegram" target="_blank" id="link-telegram">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        // CONFIGURACIÓN DE TU ENLACE ADSTERRA
        const miAdsterraLink = "https://auctionr.org";

        // DETECTOR INTELIGENTE DE VIDEOS EN LA URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v'); 
        
        if (videoUrl) {
            const videoElement = document.getElementById('mi-video');
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            videoElement.load(); 
        }

        const capa = document.getElementById('capa-publicitaria');
        const video = document.getElementById('mi-video');
        const iconoPlay = document.getElementById('icono-play');
        const textoEstado = document.getElementById('texto-estado');
        
        capa.addEventListener('click', function() {
            window.open(miAdsterraLink, '_blank');
            capa.style.display = 'none';
            video.controls = true;
            iconoPlay.style.display = 'none';
            textoEstado.innerText = "Reproductor listo. Presiona Play de nuevo para ver.";
            textoEstado.style.color = "#4caf50";
        });
    </script>
</body>
</html>
