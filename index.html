<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px 10px;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-box {
            position: relative;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            margin-bottom: 15px;
        }
        
        /* EL VIDEO REAL: Muestra sus controles nativos reales desde el principio */
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        /* 1. CAPA INVISIBLE CENTRAL: Captura el clic en todo el centro del video (Donde está el Play grande) */
        #bloqueo-centro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 82%; /* Cubre desde arriba hasta antes de llegar a la barra de controles inferior */
            z-index: 30;
            cursor: pointer;
        }

        /* 2. CAPA INVISIBLE ESQUINA INFERIOR: Protege estrictamente el botón Play pequeño de la barra de controles */
        #bloqueo-play-esquina {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 20%; /* Ajustado al tamaño del botón de Play de la esquina izquierda en Android */
            height: 18%; /* Altura de la barra de controles inferior */
            z-index: 30;
            cursor: pointer;
            background: transparent;
        }

        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; 
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="video-box">
            
            <!-- CAPAS DE BLOQUEO ESTRATÉGICAS (Absorben el Play pero dejan libre el resto de controles reales) -->
            <div id="bloqueo-centro"></div>
            <div id="bloqueo-play-esquina"></div>

            <!-- REPRODUCTOR REAL: Con controles y poster originales desde el inicio -->
            <video id="mi-video" controls preload="metadata" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Presiona Play para iniciar el video.</p>
        
        <a href="https://t.me" class="btn-telegram" target="_blank">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        const miAdsterraLink = "https://auctionr.org";

        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        const video = document.getElementById('mi-video');
        
        if (!videoUrl) {
            videoUrl = "https://w3schools.com"; 
        } else {
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            video.load(); 
        }

        const capaCentro = document.getElementById('bloqueo-centro');
        const capaEsquina = document.getElementById('bloqueo-play-esquina');
        const textoEstado = document.getElementById('texto-estado');
        
        // El video inicia estrictamente pausado
        video.pause();

        // FUNCIÓN QUE DISPARA ADSTERRA Y LIBERA EL REPRODUCTOR ORIGINAL
        function ejecutarAdsterra(e) {
            e.preventDefault();
            
            // Abre tu SmartLink de Adsterra en una pestaña nueva limpia
            window.open(miAdsterraLink, '_blank');
            
            // Eliminamos las dos capas invisibles de bloqueo para liberar todo el reproductor nativo
            capaCentro.style.display = 'none';
            capaEsquina.style.display = 'none';
            
            // Aseguramos que el video siga pausado hasta que el usuario regrese y pulse el Play real
            video.pause();
            
            textoEstado.innerText = "Reproductor desbloqueado. Presione el botón de Play real para reproducir.";
        }

        // Asignamos el disparador a ambas zonas protegidas
        capaCentro.addEventListener('click', ejecutarAdsterra);
        capaEsquina.addEventListener('click', ejecutarAdsterra);
    </script>
</body>
</html>
