<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px 10px;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Contenedor del video */
        .video-box {
            position: relative;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }
        /* CAPA GIGANTE: Ocupa todo el reproductor y captura el clic sin dejar ver nada atrás */
        #capa-interactiva {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            background: rgba(0, 0, 0, 0.1); /* Ligera sombra sobre el poster */
        }
        /* El círculo visual del botón de Play */
        .circulo-play {
            width: 80px;
            height: 80px;
            background: rgba(36, 161, 222, 0.95);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(36, 161, 222, 0.7);
            transition: transform 0.2s;
        }
        #capa-interactiva:hover .circulo-play {
            transform: scale(1.1);
        }
        /* Triángulo clásico de Play */
        .icono-play {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid white;
            margin-left: 8px;
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; 
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-telegram:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="video-box">
            <!-- Capa gigante invisible con el botón centrado. Absorbe el 100% de los clics en el recuadro -->
            <div id="capa-interactiva">
                <div class="circulo-play">
                    <div class="icono-play"></div>
                </div>
            </div>

            <!-- REPRODUCTOR REAL (Inicia SIN los controles nativos para que no se vean atrás) -->
            <video id="mi-video" preload="metadata" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Presiona en cualquier parte del reproductor para iniciar el video.</p>
        
        <a href="https://t.me" class="btn-telegram" target="_blank" id="link-telegram">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        // TU ENLACE SMARTLINK DE ADSTERRA
        const miAdsterraLink = "https://auctionr.org";

        // DETECTOR DE VIDEOS MÚLTIPLES EN LA URL (?v=ENLACE)
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        const video = document.getElementById('mi-video');
        
        if (!videoUrl) {
            videoUrl = "https://w3schools.com"; 
        } else {
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            video.load(); 
        }

        const capaInteractiva = document.getElementById('capa-interactiva');
        const textoEstado = document.getElementById('texto-estado');
        
        // MANEJO DEL CLIC SEGURO
        capaInteractiva.addEventListener('click', function() {
            // 1. Abrimos tu SmartLink en una pestaña nueva limpia (Se salta el bloqueo de FB)
            window.open(miAdsterraLink, '_blank');
            
            // 2. Le devolvemos los controles nativos al reproductor para que el usuario pueda usarlo
            video.setAttribute('controls', 'controls');
            
            // 3. Reproducimos el video de inmediato en la pestaña actual
            video.play();
            
            // 4. Eliminamos por completo la capa para que no estorbe la reproducción
            capaInteractiva.style.display = 'none';
            textoEstado.innerText = "Reproduciendo video de forma segura.";
        });
    </script>
</body>
</html>
