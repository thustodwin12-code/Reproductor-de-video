<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px 10px;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Contenedor del video con posición relativa */
        .video-box {
            position: relative;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }
        /* BOTÓN DE PLAY VISIBLE Y ATRACTIVO */
        #boton-play-falso {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: rgba(36, 161, 222, 0.9);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(36, 161, 222, 0.6);
            transition: transform 0.2s, background 0.2s;
            z-index: 10;
        }
        #boton-play-falso:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(36, 161, 222, 1);
        }
        /* Icono de triángulo de Play clásico hecho con CSS */
        .icono-play {
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid white;
            margin-left: 8px;
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; 
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-telegram:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="video-box">
            <!-- Botón de Play superpuesto -->
            <div id="boton-play-falso">
                <div class="icono-play"></div>
            </div>

            <!-- REPRODUCTOR REAL -->
            <video id="mi-video" controls preload="metadata" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Presiona el botón de Play para iniciar el video.</p>
        
        <a href="https://t.me" class="btn-telegram" target="_blank" id="link-telegram">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        // TU ENLACE SMARTLINK DE ADSTERRA
        const miAdsterraLink = "https://auctionr.org";

        // DETECTOR DE VIDEOS MÚLTIPLES EN LA URL (?v=ENLACE)
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        const video = document.getElementById('mi-video');
        
        if (!videoUrl) {
            videoUrl = "https://w3schools.com"; // Video de respaldo
        } else {
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            video.load(); 
        }

        const btnPlay = document.getElementById('boton-play-falso');
        const textoEstado = document.getElementById('texto-estado');
        
        // MANEJO DE LA INTERACCIÓN RECTIFICADA
        btnPlay.addEventListener('click', function() {
            // 1. Abrimos el SmartLink de Adsterra en una pestaña nueva limpia de forma legítima
            window.open(miAdsterraLink, '_blank');
            
            // 2. En esta misma pestaña original, reproducimos el video inmediatamente
            video.play();
            
            // 3. Escondemos el botón de play falso para revelar los controles nativos del video
            btnPlay.style.display = 'none';
            textoEstado.innerText = "Reproduciendo video de forma segura.";
        });
    </script>
</body>
</html>
