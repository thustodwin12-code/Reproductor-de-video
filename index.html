<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px 10px;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-box {
            position: relative;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }
        
        /* ESCUDO INVISIBLE: Bloquea el centro del video y el botón play nativo, 
           pero deja libre la zona del botón de silenciar (esquina inferior derecha) */
        #escudo-clickjacking {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            cursor: pointer;
            /* Recortamos el área del escudo usando clip-path para dejar libre 
               el 30% inferior derecho de la barra de controles (donde está el volumen) */
            clip-path: polygon(0% 0%, 100% 0%, 100% 85%, 70% 85%, 70% 100%, 0% 100%);
        }

        /* Botón de Play flotante centrado */
        .circulo-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75px;
            height: 75px;
            background: rgba(36, 161, 222, 0.95);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(36, 161, 222, 0.7);
            transition: transform 0.2s;
            pointer-events: none; /* Deja pasar el clic hacia el escudo */
        }
        #escudo-clickjacking:hover .circulo-play {
            transform: translate(-50%, -50%) scale(1.08);
        }
        .icono-play {
            width: 0;
            height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid white;
            margin-left: 6px;
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; 
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="video-box">
            
            <!-- Capa protectora con el botón de Play integrado -->
            <div id="escudo-clickjacking">
                <div class="circulo-play">
                    <div class="icono-play"></div>
                </div>
            </div>

            <!-- REPRODUCTOR CON CONTROLES ACTIVOS DESDE EL INICIO -->
            <video id="mi-video" controls preload="metadata" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Presiona Play para iniciar el video.</p>
        
        <a href="https://t.me" class="btn-telegram" target="_blank" id="link-telegram">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        const miAdsterraLink = "https://auctionr.org";

        // Selector de video dinámico
        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        const video = document.getElementById('mi-video');
        
        if (!videoUrl) {
            videoUrl = "https://w3schools.com"; 
        } else {
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            video.load(); 
        }

        const escudo = document.getElementById('escudo-clickjacking');
        const textoEstado = document.getElementById('texto-estado');
        
        // El video permanece pausado estrictamente hasta ejecutar la función
        video.pause();

        // CAPTURA DEL CLIC SEGURO
        escudo.addEventListener('click', function(e) {
            // 1. Abre el SmartLink de Adsterra inmediatamente en pestaña nueva
            window.open(miAdsterraLink, '_blank');
            
            // 2. Arranca el video en la pestaña actual
            video.play();
            
            // 3. Destruye el escudo para liberar completamente el reproductor original
            escudo.style.display = 'none';
            textoEstado.innerText = "Reproduciendo video de forma segura.";
        });
    </script>
</body>
</html>
