<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px 10px;
            position: relative;
        }
        /* Capa transparente invisible de Adsterra sobre TODA la pantalla */
        #capa-publicitaria {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            cursor: pointer;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Contenedor flexible que se adapta automáticamente a formatos 16:9 y 9:16 */
        .video-box {
            position: relative;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        /* Video real visible y con controles nativos desde el inicio */
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }
        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        /* BOTÓN DE TELEGRAM */
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; 
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
            transition: background 0.2s, transform 0.2s;
        }
        .btn-telegram:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Esta capa intercepta el primer clic de Adsterra -->
    <div id="capa-publicitaria"></div>

    <div class="video-container">
        <div class="video-box">
            <!-- REPRODUCTOR REAL PAUSADO DESDE EL INICIO (controls habilitado) -->
            <video id="mi-video" controls preload="metadata" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Reproductor multimedia seguro.</p>
        
        <!-- ENLACE DIRECTO A TU CANAL "SOLITARIO 🔥" -->
        <a href="https://t.me" class="btn-telegram" target="_blank" id="link-telegram">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        // TU ENLACE SMARTLINK DE ADSTERRA INTEGRADO
        const miAdsterraLink = "https://auctionr.org";

        // DETECTOR DE VIDEOS MÚLTIPLES EN LA URL
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v'); 
        const video = document.getElementById('mi-video');
        
        if (videoUrl) {
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            video.load(); 
        }

        const capa = document.getElementById('capa-publicitaria');
        const textoEstado = document.getElementById('texto-estado');
        
        // INTERCEPCIÓN DEL PRIMER CLIC EN CUALQUIER PARTE (INCLUYENDO EL BOTÓN PLAY REAL)
        capa.addEventListener('click', function() {
            // 1. Abre tu publicidad de Adsterra inmediatamente
            window.open(miAdsterraLink, '_blank');
            
            // 2. Elimina la restricción invisible
            capa.style.display = 'none';
            
            // 3. Ejecuta la reproducción del video real de inmediato
            video.play();
            
            // 4. Modifica el estado del texto inferior
            textoEstado.innerText = "Reproduciendo...";
            textoEstado.style.color = "#4caf50";
        });
    </script>
</body>
</html>
