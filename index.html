<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Seguro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px 10px;
        }
        .video-container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .video-box {
            position: relative;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #222;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        /* CAPA DE CONTROL TOTAL INICIAL */
        #capa-interactiva {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Botón de Play Falso Gigante en el centro */
        .zona-play-falso {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .circulo-play {
            width: 75px;
            height: 75px;
            background: rgba(36, 161, 222, 0.95);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(36, 161, 222, 0.7);
            transition: transform 0.2s;
        }
        .zona-play-falso:hover .circulo-play {
            transform: scale(1.08);
        }
        .icono-play {
            width: 0;
            height: 0;
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid white;
            margin-left: 6px;
        }

        /* BARRA DE CONTROLES FALSA (Imita perfectamente un reproductor móvil) */
        .barra-controles-falsa {
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            height: 48px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }
        .controles-izquierda, .controles-derecha {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .btn-control-falso {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .linea-tiempo-falsa {
            flex-grow: 1;
            height: 4px;
            background: rgba(255,255,255,0.3);
            margin: 0 15px;
            border-radius: 20px;
        }

        .loading-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
        }
        .btn-telegram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #24A1DE; 
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 5px 15px rgba(36, 161, 222, 0.4);
        }
    </style>
</head>
<body>

    <div class="video-container">
        <div class="video-box">
            
            <!-- INTERFAZ FALSA INICIAL -->
            <div id="capa-interactiva">
                <!-- Al presionar el centro activa Adsterra -->
                <div class="zona-play-falso" id="play-centro-falso">
                    <div class="circulo-play">
                        <div class="icono-play"></div>
                    </div>
                </div>

                <!-- Barra inferior simulada -->
                <div class="barra-controles-falsa">
                    <div class="controles-izquierda">
                        <!-- Play de la esquina inferior que también activa Adsterra -->
                        <button class="btn-control-falso" id="play-esquina-falso">▶</button>
                        <span style="font-size: 12px; color: #ccc;">0:00 / 1:45</span>
                    </div>
                    
                    <div class="linea-tiempo-falsa"></div>
                    
                    <div class="controles-derecha">
                        <!-- MANDO DE SILENCIAR REAL Y FUNCIONAL -->
                        <button class="btn-control-falso" id="btn-silenciar-real">🔊</button>
                        <button class="btn-control-falso">⛶</button>
                    </div>
                </div>
            </div>

            <!-- REPRODUCTOR REAL (Inicia sin controles nativos y pausado) -->
            <video id="mi-video" preload="metadata" poster="https://unsplash.com">
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Tu navegador no soporta reproducción de video.
            </video>
        </div>
        <p class="loading-text" id="texto-estado">Presiona Play para desbloquear el reproductor de video.</p>
        
        <a href="https://t.me" class="btn-telegram" target="_blank">
            Únete al Canal de Telegram
        </a>
    </div>

    <script>
        const miAdsterraLink = "https://auctionr.org";

        const urlParams = new URLSearchParams(window.location.search);
        let videoUrl = urlParams.get('v'); 
        const video = document.getElementById('mi-video');
        
        if (!videoUrl) {
            videoUrl = "https://w3schools.com"; 
        } else {
            const sourceElement = document.getElementById('video-source');
            sourceElement.src = videoUrl;
            video.load(); 
        }

        const capaInteractiva = document.getElementById('capa-interactiva');
        const playCentro = document.getElementById('play-centro-falso');
        const playEsquina = document.getElementById('play-esquina-falso');
        const btnSilenciar = document.getElementById('btn-silenciar-real');
        const textoEstado = document.getElementById('texto-estado');
        
        // Asegurar que el video esté pausado por defecto
        video.pause();

        // 1. MANDO DE SILENCIAR REAL (Funciona antes de abrir la publicidad)
        btnSilenciar.addEventListener('click', function(e) {
            e.stopPropagation(); // Evita que se abra el anuncio al silenciar
            video.muted = !video.muted;
            btnSilenciar.innerText = video.muted ? "🔇" : "🔊";
        });

        // FUNCIÓN PARA EJECUTAR PUBLICIDAD Y DEJAR EL VIDEO EN ESPERA
        function ejecutarAdsterra() {
            // Abre Adsterra en pestaña nueva
            window.open(miAdsterraLink, '_blank');
            
            // Destruye la capa falsa por completo
            capaInteractiva.style.display = 'none';
            
            // Activa los controles nativos reales del navegador
            video.setAttribute('controls', 'controls');
            
            // El video se mantiene estrictamente pausado
            video.pause(); 
            
            textoEstado.innerText = "Reproductor desbloqueado. Presione el botón de Play real para reproducir.";
        }

        // Vincular ambos botones de Play falsos a la función publicitaria
        playCentro.addEventListener('click', ejecutarAdsterra);
        playEsquina.addEventListener('click', ejecutarAdsterra);
    </script>
</body>
</html>
